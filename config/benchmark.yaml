# BharatToolBench benchmark configuration (provider-neutral).
benchmark_version: "3.0.0"   # 200 tasks x 5 languages = 1000 items in three tool stages: T01-T75 (6 tools), T76-T100 (12), T101-T200 (20).
                             # 2.1.0 = T01-T75 only, 375 items, 6 tools (git tag v2.1.0-data); 0.1.0-foundation = the 200-item mid-sem runs
offer_all_tools: false       # each item is offered the tools of its stage (its row's allowed_tools); true = all twenty for every item
reference_datetime: "2026-10-05T09:00:00+05:30"   # pinned "now" (IST). NEVER use the system clock.
timezone: "IST (UTC+05:30)"
canonical_formats:
  date: "YYYY-MM-DD"
  time: "HH:MM (24-hour)"
languages: [en, hinglish, hi, mr, gu]
environment:
  station_count: 10
  train_count: 30
  travel_classes: [3A, 2A, SL, CC]
  tools:
    - resolve_station
    - search_trains
    - get_train_details
    - check_availability
    - get_fare
    - book_ticket
    - get_booking_status       # 3.0
    - get_cancellation_refund  # 3.0
    - cancel_ticket            # 3.0
    - join_waitlist            # 3.0
    - get_live_train_status    # 3.0
    - get_concession_fare      # 3.0
    - check_tatkal_availability  # 3.0, 20-tool stage
    - book_tatkal_ticket
    - get_berth_availability
    - get_platform_info
    - change_boarding_point
    - order_meal
    - file_tdr
    - raise_complaint
# Named time windows used when authoring tasks (tools themselves take explicit HH:MM ranges).
named_time_windows:
  morning:   {start: "05:00", end: "11:59"}
  afternoon: {start: "12:00", end: "16:59"}
  evening:   {start: "17:00", end: "20:59"}
  night:     {start: "21:00", end: "04:59"}   # wraps past midnight
